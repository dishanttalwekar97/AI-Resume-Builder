apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: resume-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: resume-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: resume-app
    spec:
      containers:
        - name: frontend
          image: dishanttwi123/ai-resume-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
