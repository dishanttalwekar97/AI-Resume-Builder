apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-app
  namespace: resume-app
spec:
  # Enable the NGINX Ingress addon in Minikube before applying this file.
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
