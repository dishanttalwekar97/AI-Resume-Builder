# Do not put real secrets in Git. Create this Secret with the kubectl command
# in the deployment guide instead of applying this example file.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: resume-app
type: Opaque
stringData:
  MONGODB_URI: "REPLACE_WITH_YOUR_MONGODB_ATLAS_URI"
  JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_VALUE"
  OPENAI_API_KEY: "REPLACE_WITH_YOUR_OPENAI_API_KEY"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"
  IMAGEKIT_PRIVATE_KEY: "REPLACE_WITH_YOUR_IMAGEKIT_PRIVATE_KEY"
